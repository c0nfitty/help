<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goblin Horde — Class Wars</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0a0a12;display:flex;justify-content:center;padding:16px;font-family:'Courier New',monospace;min-width:720px;}
.root{display:flex;flex-direction:column;gap:8px;width:700px;}
.hud{display:flex;gap:6px;align-items:center;font-size:11px;}
.bw{display:flex;flex-direction:column;gap:2px;flex:1;}
.bl{font-size:10px;letter-spacing:.08em;color:#777;text-transform:uppercase;}
.bt{height:9px;border-radius:2px;overflow:hidden;background:#111;border:1px solid #222;}
.bf{height:100%;border-radius:2px;transition:width .2s;}
.hr{color:#c8a9f0;white-space:nowrap;font-size:13px;}
.hbtn{font-size:10px;padding:3px 8px;background:transparent;border:1px solid #444;color:#aaa;border-radius:2px;cursor:pointer;}
.hbtn:hover{border-color:#888;color:#fff;}
.cwrap{position:relative;width:700px;}
canvas{display:block;border-radius:4px;outline:none;}
.sb{display:flex;gap:5px;width:700px;justify-content:center;flex-wrap:wrap;}
.ss{background:#0d0d1a;border:1px solid #2a2a3a;border-radius:3px;padding:4px 6px;text-align:center;font-size:10px;color:#555;min-width:68px;}
.ss.rdy{border-color:#888;color:#ccc;}
.ss.ult{border-color:#f5c842;color:#f5c842;background:#0a0a00;}
.ss.ult.rdy{box-shadow:0 0 5px #f5c84244;}
.sk{font-size:12px;font-weight:700;}
.hint{font-size:11px;color:#444;text-align:center;}
/* Class select overlay */
.csel{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(2,1,12,.98);z-index:20;border-radius:4px;display:flex;flex-direction:column;overflow:hidden;}
.csel-title{font-size:20px;font-weight:700;color:#f5c842;letter-spacing:.1em;text-align:center;padding:14px 16px 6px;flex-shrink:0;border-bottom:1px solid #333;}
.csel-subtitle{font-size:12px;color:#666;text-align:center;padding:6px 16px 0;flex-shrink:0;}
.csel-scroll{flex:1;overflow-y:auto;padding:12px 14px;scrollbar-width:thin;scrollbar-color:#333 transparent;}
.csel-scroll::-webkit-scrollbar{width:6px;}.csel-scroll::-webkit-scrollbar-thumb{background:#333;border-radius:3px;}
.csel-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.csel-footer{flex-shrink:0;padding:10px 14px;border-top:1px solid #222;display:flex;gap:10px;align-items:center;justify-content:space-between;}
.csel-selected-label{font-size:13px;color:#888;}
.csel-selected-name{font-size:14px;font-weight:700;color:#f5c842;}
.ccard{border:1px solid #2a2a3a;border-radius:8px;padding:12px 14px;cursor:pointer;background:#0a0a18;transition:all .15s;display:flex;gap:12px;align-items:flex-start;}
.ccard:hover{border-color:#555;background:#12121e;}
.ccard.selected{border-color:#f5c842;background:#0e0e08;box-shadow:0 0 12px rgba(245,200,66,.15);}
.ccard-left{flex-shrink:0;text-align:center;width:40px;}
.ccard-icon{font-size:28px;display:block;margin-bottom:4px;}
.ccard-hp{font-size:9px;color:#e24b4a;white-space:nowrap;}
.ccard-res{font-size:9px;white-space:nowrap;}
.ccard-right{flex:1;min-width:0;}
.ccard-name{font-size:14px;font-weight:700;color:#fff;margin-bottom:3px;}
.ccard-desc{font-size:11px;color:#888;line-height:1.5;margin-bottom:5px;}
.ccard.selected .ccard-desc{color:#bbb;}
.ccard-passive{font-size:10px;color:#f5c842;margin-bottom:5px;line-height:1.4;}
.ccard-ab{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;}
.ccard-ab span{font-size:10px;color:#556;line-height:1.5;}
.ccard.selected .ccard-ab span{color:#778;}
.ccard-ab span::before{content:'• ';}
.start-btn{font-size:14px;padding:10px 28px;background:#f5c842;color:#0a0a00;border:none;border-radius:6px;cursor:pointer;font-family:'Courier New',monospace;font-weight:700;letter-spacing:.06em;white-space:nowrap;}
.start-btn:hover{background:#ffd700;transform:scale(1.03);}
/* Perk overlay */
.pov{display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(2,1,12,.96);z-index:10;border-radius:4px;padding:14px;overflow-y:auto;}
.pov.on{display:flex;flex-direction:column;gap:7px;}
.pt{font-size:14px;color:#c8a9f0;text-align:center;letter-spacing:.1em;}
.pcols{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.pcol{display:flex;flex-direction:column;gap:4px;}
.pctitle{font-size:11px;text-align:center;padding:5px;border-radius:2px;font-weight:700;}
.pnode{border:1px solid #1a1a2a;border-radius:3px;padding:5px 4px;font-size:9px;color:#333;position:relative;}
.pnode.av{border-color:#6a3fa066;color:#c8a9f0;cursor:pointer;}
.pnode.av:hover{background:rgba(106,63,160,.15);}
.pnode.ow{border-color:#97c459;color:#97c459;background:rgba(151,196,89,.05);}
.pnode-nm{font-size:11px;font-weight:700;margin-bottom:2px;}
.pnode-ds{font-size:10px;line-height:1.4;color:#555;}
.pnode.ow .pnode-ds{color:#5a8028;}
.pnode-ct{position:absolute;top:2px;right:3px;font-size:8px;color:#f5c842;}
.usec{border-top:1px solid #222;padding-top:6px;}
.utitle{font-size:10px;color:#f5c842;margin-bottom:5px;text-align:center;}
.ugrid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;}
.ucard{border:1px solid #2a2000;border-radius:3px;padding:6px;font-size:9px;text-align:center;}
.ucard.ul{border-color:#f5c842;background:#080800;color:#f5c842;}
.ucard.lk{color:#333;}
.ucard-nm{font-size:12px;font-weight:700;margin-bottom:3px;}
.ucard-req{font-size:8px;margin-bottom:2px;color:#555;}
.ucard-ds{font-size:10px;line-height:1.4;color:#666;}
.ucard.ul .ucard-ds{color:#806600;}
.pfooter{display:flex;justify-content:space-between;align-items:center;padding-top:6px;font-size:12px;}
.lvlb{display:none;position:absolute;top:26%;left:50%;transform:translateX(-50%);background:rgba(2,1,12,.97);border:1px solid #97c459;border-radius:3px;padding:7px 18px;font-size:11px;color:#97c459;text-align:center;z-index:5;pointer-events:none;white-space:nowrap;}
</style>
</head>
<body>
<div class="root">
  <div class="hud">
    <div class="bw"><div class="bl">HP</div><div class="bt"><div class="bf" id="hf" style="width:100%;background:#e24b4a;"></div></div></div>
    <div class="bw"><div class="bl" id="res2lbl">Mana</div><div class="bt"><div class="bf" id="mf" style="width:100%;background:#6a60e8;"></div></div></div>
    <div class="bw"><div class="bl">XP</div><div class="bt"><div class="bf" id="xf" style="width:0%;background:#97c459;"></div></div></div>
    <div class="hr">Wave<span id="wv">1</span>&nbsp;Score<span id="sc">0</span>&nbsp;Lv<span id="lv">1</span></div>
    <button class="hbtn" onclick="togglePerks()">[P]Perks</button>
    <button class="hbtn" id="rb">[ Start ]</button>
  </div>
  <div class="cwrap">
    <canvas id="gc" width="700" height="420" tabindex="0"></canvas>
    <!-- Class select -->
    <div class="csel" id="csel">
      <div class="csel-title">⚔ CHOOSE YOUR CLASS ⚔</div>
      <div class="csel-subtitle">Click a class to select · Scroll to see all 10</div>
      <div class="csel-scroll">
        <div class="csel-grid" id="cselGrid"></div>
      </div>
      <div class="csel-footer">
        <div>
          <div class="csel-selected-label">Selected:</div>
          <div class="csel-selected-name" id="cselName">Wizard</div>
        </div>
        <button class="start-btn" onclick="confirmClass()">▶ ENTER THE ARENA</button>
      </div>
    </div>
    <!-- Perk overlay -->
    <div class="pov" id="pov">
      <div class="pt" id="ptitle">✦ SKILL TREE ✦</div>
      <div class="pcols" id="pcols"></div>
      <div class="usec">
        <div class="utitle">⚡ CLASS ULTIMATES — unlock for 2 perk pts each ⚡</div>
        <div class="ugrid" id="ugrid"></div>
      </div>
      <div class="pfooter">
        <span style="color:#f5c842">Points: <span id="ppel">0</span></span>
        <button class="hbtn" onclick="togglePerks()">[Close]</button>
      </div>
    </div>
    <div class="lvlb" id="lvlb"></div>
  </div>
  <div class="sb" id="sb"></div>
  <div class="hint" id="hint">click canvas · WASD/arrows=move+jump · 1/2/3/4=abilities · 6/7=ultimates · P=perks</div>
</div>

<script>
const CV=document.getElementById('gc'),CX=CV.getContext('2d');
const W=700,H=420,T=32,GV=0.5;

// ═══════════════════════════════════════════════════════════════
// CLASS DEFINITIONS
// Each class has:
//   res: resource name, resCol, maxRes
//   abilities[4]: {name,key,cost,cd,desc, cast(player,G)}
//   ultimates[2]: {name,desc,req (perk ids), cd, col, exec(player,G)}
//   perks[4 trees of 4]: same shape as before but class-specific
//   drawPlayer(p,CX,tick)
// ═══════════════════════════════════════════════════════════════

const CLASSES={

// ─────────────────────────────────────────────────────────────
wizard:{
  name:'Wizard',icon:'🧙',col:'#9d4edd',
  desc:'Arcane spellcaster. Masters of fire, ice, and lightning.',
  resName:'Mana',resCol:'#6a60e8',maxRes:100,
  hp:90,
  passive:'Arcane Mastery: Mana regenerates 2× faster. All spell cooldowns reduced by 15%.',
  abilityKeys:['1','2','3','4'],
  abilities:[
    {name:'Fireball',key:'1',cost:20,cd:40,desc:'Burning projectile. Splits with Inferno perk.',
     cast(p,G){
       const has=id=>G.owned.has(id);
       if(has('wf4')){
         const tgt=G.enemies.filter(e=>e.alive).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y))[0];
         const tx=tgt?tgt.x+tgt.w/2:p.x+p.facing*200;
         spawnProj(G,tx,-20,(Math.random()-.5)*.8,10,18,'#ff4400',130,'fire',{isMeteor:true});
         return;
       }
       const ox=p.x+(p.facing===1?p.w+3:-3),oy=p.y+12;
       spawnProj(G,ox,oy,p.facing*10,0,has('wf1')?17:10,'#e8820a',42,'fire',{});
     }},
    {name:'Ice Lance',key:'2',cost:15,cd:24,desc:'Freezes enemies. Blizzard fires 3 at once.',
     cast(p,G){
       const has=id=>G.owned.has(id);
       if(has('wi4')){G.enemies.forEach(e=>{if(e.alive){e.frozen=has('wi1')?280:140;emitP(G,e.x+e.w/2,e.y,'#85b7eb',8,2);}});addFloat(G,'ABSOLUTE ZERO!',W/2,H/2,'#85b7eb');return;}
       const ox=p.x+(p.facing===1?p.w+3:-3),oy=p.y+12,vx=p.facing*14;
       if(has('wi3')){spawnProj(G,ox,oy,vx,-1.5,7,'#85b7eb',24,'ice',{});spawnProj(G,ox,oy,vx,0,7,'#85b7eb',24,'ice',{});spawnProj(G,ox,oy,vx,1.5,7,'#85b7eb',24,'ice',{});}
       else spawnProj(G,ox,oy,vx,0,7,'#85b7eb',24,'ice',{});
     }},
    {name:'Thunder',key:'3',cost:35,cd:78,desc:'Chain lightning hits multiple enemies.',
     cast(p,G){
       const has=id=>G.owned.has(id);
       if(has('wt4')){G.stormTick=240;addFloat(G,'STORM!',W/2,80,'#f5c842');return;}
       const chain=3+(has('wt1')?2:0),bd=has('wt2')?120:80;
       const sorted=[...G.enemies].filter(e=>e.alive).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y));
       sorted.slice(0,chain).forEach((e,i)=>{setTimeout(()=>{if(!e.alive)return;const d=Math.round(bd/(1+i*.3));e.stunned=60;hurtE(G,e,d,'#f5c842');addFloat(G,'-'+d,e.x+e.w/2,e.y-10,'#f5c842');if(has('wt3')&&!e.alive)emitP(G,e.x+e.w/2,e.y+e.h/2,'#f5c842',28,6);},i*100);});
       emitP(G,p.x+p.w/2,p.y-10,'#f5c842',25,5);
     }},
    {name:'Blink',key:'4',cost:18,cd:95,desc:'Teleport. Phase Burst damages arrival point.',
     cast(p,G){
       const has=id=>G.owned.has(id);
       const dist=120*(has('wb1')?2:1);
       const dx=Math.max(0,Math.min(W-p.w,p.x+(p.facing===1?dist:-dist)));
       if(has('wb3')){const px=p.x+p.w/2,pdx=dx+p.w/2;G.enemies.forEach(e=>{if(!e.alive)return;const ex=e.x+e.w/2;if(ex>Math.min(px,pdx)&&ex<Math.max(px,pdx))hurtE(G,e,65,'#9d4edd');});}
       emitP(G,p.x+p.w/2,p.y+p.h/2,'#9d4edd',16,4);
       p.x=dx;
       if(has('wb2')){G.enemies.forEach(e=>{if(e.alive&&Math.hypot(e.x-p.x,e.y-p.y)<85)hurtE(G,e,55,'#9d4edd');});emitP(G,p.x+p.w/2,p.y+p.h/2,'#9d4edd',22,6);}
       if(has('wb4'))p.inv=180;
       emitP(G,p.x+p.w/2,p.y+p.h/2,'#9d4edd',16,4);
     }},
  ],
  perks:[
    {tree:'Fire',col:'#e8820a',perks:[
      {id:'wf1',name:'Wide Blast',desc:'Fireball radius +6',req:[]},
      {id:'wf2',name:'Scorch',desc:'Burn DoT 3/tick',req:['wf1']},
      {id:'wf3',name:'Inferno',desc:'Splits 3 on hit',req:['wf1']},
      {id:'wf4',name:'Meteor',desc:'Sky-drop AoE',req:['wf2','wf3']},
    ]},
    {tree:'Ice',col:'#85b7eb',perks:[
      {id:'wi1',name:'Deep Freeze',desc:'Freeze 2× longer',req:[]},
      {id:'wi2',name:'Shatter',desc:'2× dmg on frozen',req:['wi1']},
      {id:'wi3',name:'Blizzard',desc:'3 lances at once',req:['wi1']},
      {id:'wi4',name:'Absolute Zero',desc:'Freeze all',req:['wi2','wi3']},
    ]},
    {tree:'Thunder',col:'#f5c842',perks:[
      {id:'wt1',name:'Chain +2',desc:'+2 chain targets',req:[]},
      {id:'wt2',name:'Overload',desc:'+50% dmg',req:['wt1']},
      {id:'wt3',name:'Static',desc:'Stunned→explode',req:['wt1']},
      {id:'wt4',name:'Storm Call',desc:'4s storm',req:['wt2','wt3']},
    ]},
    {tree:'Blink',col:'#9d4edd',perks:[
      {id:'wb1',name:'Long Range',desc:'Distance ×2',req:[]},
      {id:'wb2',name:'Phase Burst',desc:'AoE at arrival',req:['wb1']},
      {id:'wb3',name:'Shadow Step',desc:'Damage path',req:['wb1']},
      {id:'wb4',name:'Void Walk',desc:'3s invincibility',req:['wb2','wb3']},
    ]},
  ],
  ultimates:[
    {id:'wu1',name:'ARCANE NOVA',req:[],cd:700,col:'#f5c842',
     desc:'All elements fire simultaneously. Freeze, meteors, and chain lightning.',
     exec(p,G){
       addFloat(G,'ARCANE NOVA!!!',W/2,H/2-50,'#f5c842');
       G.enemies.forEach(e=>{if(e.alive){e.frozen=180;emitP(G,e.x+e.w/2,e.y,'#85b7eb',8,2);}});
       for(let i=0;i<10;i++)setTimeout(()=>{if(!G.running)return;spawnProj(G,40+Math.random()*(W-80),-20,(Math.random()-.5)*2,9,18,'#ff4400',120,'fire',{isMeteor:true});},i*130);
       setTimeout(()=>{if(!G.running)return;G.enemies.forEach((e,i)=>setTimeout(()=>{if(e.alive){hurtE(G,e,150,'#f5c842');e.stunned=100;emitP(G,e.x+e.w/2,e.y,'#f5c842',20,5);}},i*40));},700);
       setTimeout(()=>{if(!G.running)return;p.hp=Math.min(p.maxHp,p.hp+40);G.stormTick=250;},1200);
     }},
    {id:'wu2',name:'GLACIAL WRATH',req:[],cd:550,col:'#40d0ff',
     desc:'Freeze ALL enemies, then shatter each with lightning.',
     exec(p,G){
       G.enemies.forEach(e=>{if(e.alive){e.frozen=300;emitP(G,e.x+e.w/2,e.y,'#85b7eb',10,3);}});
       addFloat(G,'FROZEN!',W/2,H/2,'#85b7eb');
       setTimeout(()=>{if(!G.running)return;G.enemies.forEach((e,i)=>setTimeout(()=>{if(!e.alive)return;e.frozen=0;hurtE(G,e,200,'#f5c842');e.stunned=60;emitP(G,e.x+e.w/2,e.y+e.h/2,'#f5c842',16,5);addFloat(G,'-200',e.x+e.w/2,e.y-10,'#40d0ff');},i*80));},1200);
     }},
  ],
  drawPlayer(p,cx,tick){
    cx.save();cx.translate(p.x+p.w/2,p.y+p.h/2);if(p.facing===-1)cx.scale(-1,1);
    const bob=p.grounded?Math.sin(p.frame*Math.PI/2)*1.5:0;
    cx.fillStyle='#2a1848';cx.beginPath();cx.moveTo(-p.w/2,-p.h/2+10+bob);cx.lineTo(-p.w/2+4,p.h/2+bob);cx.lineTo(p.w/2-4,p.h/2+bob);cx.lineTo(p.w/2,-p.h/2+10+bob);cx.closePath();cx.fill();cx.strokeStyle='#9d4edd';cx.lineWidth=1;cx.stroke();
    cx.fillStyle='#9d4edd';cx.fillRect(-p.w/2,-p.h/2+10+bob,p.w,2);
    cx.fillStyle='#e8c8a0';cx.beginPath();cx.ellipse(0,-p.h/2+4+bob,8,9,0,0,Math.PI*2);cx.fill();
    cx.fillStyle='#1a0a00';cx.beginPath();cx.arc(-3,-p.h/2+4+bob,1.5,0,Math.PI*2);cx.fill();cx.fillStyle='#9d4edd';cx.beginPath();cx.arc(-3,-p.h/2+4+bob,.8,0,Math.PI*2);cx.fill();
    cx.fillStyle='#1a0a00';cx.beginPath();cx.arc(3,-p.h/2+4+bob,1.5,0,Math.PI*2);cx.fill();cx.fillStyle='#9d4edd';cx.beginPath();cx.arc(3,-p.h/2+4+bob,.8,0,Math.PI*2);cx.fill();
    cx.fillStyle='#1a0d2e';cx.beginPath();cx.moveTo(-10,-p.h/2+bob);cx.lineTo(10,-p.h/2+bob);cx.lineTo(4,-p.h/2-22+bob);cx.lineTo(-2,-p.h/2-26+bob);cx.closePath();cx.fill();cx.strokeStyle='#9d4edd';cx.lineWidth=.8;cx.stroke();
    cx.fillStyle='#9d4edd';cx.fillRect(-11,-p.h/2+bob,22,4);
    cx.fillStyle='#f5c842';cx.font='8px sans-serif';cx.textAlign='center';cx.fillText('☽',0,-p.h/2-6+bob);cx.textAlign='left';
    const lob=p.grounded?Math.sin(p.frame*Math.PI/2)*4:0;
    cx.strokeStyle='#8b6914';cx.lineWidth=3;cx.beginPath();cx.moveTo(p.w/2-2,bob-2);cx.lineTo(p.w/2+14,bob-14+lob);cx.stroke();
    const cg=p.castAnim>0;if(cg){cx.globalAlpha=p.castAnim/20;cx.fillStyle=p.castCol;cx.beginPath();cx.arc(p.w/2+14,bob-14+lob,12,0,Math.PI*2);cx.fill();cx.globalAlpha=1;}
    cx.fillStyle=cg?p.castCol:'#85b7eb';cx.beginPath();cx.arc(p.w/2+14,bob-14+lob,5,0,Math.PI*2);cx.fill();
    cx.fillStyle='#fff';cx.beginPath();cx.arc(p.w/2+12,bob-16+lob,2,0,Math.PI*2);cx.fill();
    cx.restore();
  }
},

// ─────────────────────────────────────────────────────────────
knight:{
  name:'Knight',icon:'⚔️',col:'#c0c0c0',
  desc:'Heavy armour melee fighter. High HP, low range.',
  resName:'Stamina',resCol:'#22aa44',maxRes:100,
  hp:160,
  passive:'Iron Will: Take 20% less damage. Being hit builds Stamina (+8 per hit).',
  abilityKeys:['1','2','3','4'],
  abilities:[
    {name:'Sword Slash',key:'1',cost:15,cd:20,desc:'Wide melee arc hits all nearby enemies.',
     cast(p,G){
       const has=id=>G.owned.has(id);
       const range=has('ks1')?80:55,dmg=has('ks2')?55:35;
       let hit=false;
       G.enemies.forEach(e=>{
         if(!e.alive)return;
         const dx=e.x+e.w/2-(p.x+p.w/2),dy=e.y+e.h/2-(p.y+p.h/2);
         if(Math.abs(dx)<range&&Math.abs(dy)<40&&(p.facing===1?dx>-10:dx<10)){
           hurtE(G,e,dmg,'#c8c0a8');hit=true;
           if(has('ks3'))e.stunned=60;
         }
       });
       emitP(G,p.x+(p.facing===1?p.w+20:-(p.w+20)),p.y+p.h/2,'#c8c0a8',hit?12:6,3);
       // Swing arc visual
       G.swingAnim={x:p.x+p.w/2,y:p.y+p.h/2,facing:p.facing,t:12,range};
     }},
    {name:'Shield Bash',key:'2',cost:20,cd:40,desc:'Knocks back and stuns nearby enemies.',
     cast(p,G){
       const has=id=>G.owned.has(id);
       const range=has('kb1')?70:45;
       G.enemies.forEach(e=>{
         if(!e.alive)return;
         const dx=e.x+e.w/2-(p.x+p.w/2),dy=e.y+e.h/2-(p.y+p.h/2);
         if(Math.abs(dx)<range&&Math.abs(dy)<35){
           hurtE(G,e,20,'#8888ff');

    cx.fillStyle='#e8c8a0';cx.beginPath();cx.ellipse(0,-p.h/2+5+bob,8,9,0,0,Math.PI*2);cx.fill();
    // Tonsure ring of hair (brown)

    cx.beginPath();cx.arc(0,-p.h/2+5+bob,8,.6,Math.PI-.6);cx.stroke(); // back of head
    cx.beginPath();cx.arc(0,-p.h/2+5+bob,8,Math.PI+.5,-.5);cx.stroke(); // sides
    // Face — kindly friar
    cx.fillStyle='#1a0a00';cx.beginPath();cx.arc(-3,-p.h/2+4+bob,1.5,0,Math.PI*2);cx.fill();cx.beginPath();cx.arc(3,-p.h/2+4+bob,1.5,0,Math.PI*2);cx.fill();
    // Smile
    cx.strokeStyle='#4a2a10';cx.lineWidth=1;cx.beginPath();cx.arc(0,-p.h/2+7+bob,2,.2,Math.PI-.2);cx.stroke();
    // Bushy eyebrows (wise friar look)
    cx.strokeStyle='#4a2a00';cx.lineWidth=1.5;
    cx.beginPath();cx.moveTo(-5,-p.h/2+2+bob);cx.lineTo(-1,-p.h/2+1+bob);cx.stroke();
    cx.beginPath();cx.moveTo(5,-p.h/2+2+bob);cx.lineTo(1,-p.h/2+1+bob);cx.stroke();
    // Hood (pushed back, shows top of head)
    cx.fillStyle='#5a3a14';
    cx.beginPath();cx.moveTo(-p.w/2,-p.h/2+bob);cx.lineTo(-p.w/2+3,-p.h/2+12+bob);cx.lineTo(p.w/2-3,-p.h/2+12+bob);cx.lineTo(p.w/2,-p.h/2+bob);cx.closePath();cx.fill();
    cx.strokeStyle='#8b6a30';cx.lineWidth=.8;cx.stroke();
    // Holy Ward aura
    if(ward){
      cx.globalAlpha=.18+Math.sin(t*2)*.08;
      cx.fillStyle='#88aaff';cx.beginPath();cx.arc(0,bob,32,0,Math.PI*2);cx.fill();
      cx.globalAlpha=.5+Math.sin(t*2)*.25;cx.strokeStyle='#88aaff';cx.lineWidth=1.5;
      cx.beginPath();cx.arc(0,bob,32,0,Math.PI*2);cx.stroke();
      // Ward charge count
      cx.globalAlpha=1;cx.fillStyle='#88aaff';cx.font='bold 10px sans-serif';cx.textAlign='center';
      cx.fillText(p.wardCharges,0,-32+bob);
    }
    // Mace arm
    const lob2=p.grounded?Math.sin(p.frame*Math.PI/2)*4:0;
    // Handle
    cx.strokeStyle='#5a3a10';cx.lineWidth=3;cx.beginPath();cx.moveTo(p.w/2,bob-2);cx.lineTo(p.w/2+14,bob-14+lob2);cx.stroke();
    // Mace head
    cx.fillStyle='#888878';cx.beginPath();cx.arc(p.w/2+14,bob-14+lob2,6,0,Math.PI*2);cx.fill();
    cx.strokeStyle='#aaaaaa';cx.lineWidth=1;cx.strokeStyle='#aaa';
    // Flanges
    for(let fi=0;fi<4;fi++){
      const fa=fi*Math.PI/2+(t*.5);
      cx.fillStyle='#999988';
      cx.beginPath();cx.moveTo(p.w/2+14+Math.cos(fa)*5,bob-14+lob2+Math.sin(fa)*5);
      cx.lineTo(p.w/2+14+Math.cos(fa)*9,bob-14+lob2+Math.sin(fa)*9);
      cx.lineTo(p.w/2+14+Math.cos(fa+.4)*7,bob-14+lob2+Math.sin(fa+.4)*7);
      cx.closePath();cx.fill();
    }
    const cg=p.castAnim>0;
    if(cg){cx.globalAlpha=p.castAnim/20;cx.fillStyle=p.castCol;cx.beginPath();cx.arc(p.w/2+14,bob-14+lob2,12,0,Math.PI*2);cx.fill();}
    cx.globalAlpha=1;cx.textAlign='left';cx.restore();
  }
},

    cx.fillStyle='#fff';cx.fillRect(-p.w/2+4,-p.h/2+4+bob,5,3);
    // Antennae
    cx.strokeStyle='#00e5ff';cx.lineWidth=1;cx.beginPath();cx.moveTo(-4,-p.h/2+bob);cx.lineTo(-5,-p.h/2-7+bob);cx.stroke();cx.beginPath();cx.moveTo(4,-p.h/2+bob);cx.lineTo(5,-p.h/2-7+bob);cx.stroke();

    // Shield aura
    if(shielded){
      cx.globalAlpha=.15+Math.sin(t*2)*.08;cx.fillStyle='#00e5ff';cx.beginPath();cx.arc(0,bob,30,0,Math.PI*2);cx.fill();

      cx.globalAlpha=1;cx.fillStyle='#00e5ff';cx.font='bold 9px sans-serif';cx.textAlign='center';cx.fillText(p.wardCharges,0,-30+bob);
    }
    cx.globalAlpha=1;cx.textAlign='left';cx.restore();
  }
},

function goblinVariant(tier){return ENEMY_POOLS.goblin[Math.min(tier,4)];}

function spawnEnemy(){
  const wave=G.wave;
  // Wave 1-2: goblins only. Wave 3+: mix in skeletons. Wave 5+: orcs. Wave 7+: mummies
  let pool=ENEMY_POOLS.goblin;
  const r=Math.random();
  if(wave>=14&&r<0.12) pool=ENEMY_POOLS.golem;
  else if(wave>=12&&r<0.18) pool=ENEMY_POOLS.troll;
  else if(wave>=10&&r<0.20) pool=ENEMY_POOLS.vampire;
  else if(wave>=9&&r<0.22)  pool=ENEMY_POOLS.werewolf;
  else if(wave>=8&&r<0.25)  pool=ENEMY_POOLS.spider;
  else if(wave>=7&&r<0.28)  pool=ENEMY_POOLS.mummy;
  else if(wave>=5&&r<0.38)  pool=ENEMY_POOLS.orc;
  else if(wave>=3&&r<0.50)  pool=ENEMY_POOLS.skeleton;
  else if(wave>=2&&r<0.30)  pool=ENEMY_POOLS.ranged;
  const poolTier=Math.min(Math.floor(wave/4),pool.length-1);
  const tier=(Math.random()<.18&&poolTier>0)?Math.min(poolTier+1,pool.length-1):poolTier;
  const v=pool[tier];
  const side=Math.random()<.5;
  const spawnX=side?Math.max(-20,0):Math.min(W+20,W-1);
  return{...v,maxHp:v.hp,x:spawnX,y:H-T-v.h,vx:0,vy:0,grounded:false,frozen:0,stunned:0,burn:0,dmgFlash:0,alive:true,fr:0,ft:0,tier};
}
function spawnGoblin(){return spawnEnemy();}

function hurtE(g,e,dmg,col){
  if(!e.alive)return;
  // Iron Wall perk for knight
  if(false)dmg=Math.round(dmg*.7);
  e.hp-=dmg;e.dmgFlash=10;
  emitP(g,e.x+e.w/2,e.y+e.h/2,col||'#fff',6,2);
  if(e.hp<=0)killE(g,e);
}

function killE(g,e){
  if(!e.alive)return;
  e.alive=false;g.score+=e.score;g.xp+=e.xpv;
  // Death Mark: marked kills explode
  if(e.marked&&g.owned.has('rv4')&&g.curClass==='ranger'){
    g.enemies.forEach(e2=>{if(e2.alive&&Math.hypot(e2.x-e.x,e2.y-e.y)<80){hurtE(g,e2,60,'#97c459');}});
    emitP(g,e.x+e.w/2,e.y+e.h/2,'#97c459',24,6);
    addFloat(g,'DEATH MARK!',e.x+e.w/2,e.y-15,'#97c459');
  }
  emitP(g,e.x+e.w/2,e.y+e.h/2,e.col,12,4);
  addFloat(g,'+'+e.score,e.x+e.w/2,e.y-12,'#f5c842');
  // Cowboy Grit passive: +1 ammo per kill
  if(g.curClass==='cowboy')g.player.res=Math.min(g.player.maxRes,g.player.res+1);
  // Gunslinger perk: full reload
  if(g.curClass==='cowboy'&&g.owned.has('cr4'))g.player.res=g.player.maxRes;
  // Knight rampage perk
  if(g.curClass==='knight'&&g.owned.has('kw4')&&g.player.warcry>0){g.player.hp=Math.min(g.player.maxHp,g.player.hp+5);addFloat(g,'+5',g.player.x+g.player.w/2,g.player.y-15,'#44ff44');}
  if(g.xp>=g.xpNext){
    g.level++;g.xp-=g.xpNext;g.xpNext=Math.round(g.xpNext*1.65);
    g.player.maxHp+=10;g.player.hp=Math.min(g.player.hp+25,g.player.maxHp);
    g.player.res=g.player.maxRes;
    g.perkPts++;
    document.getElementById('lv').textContent=g.level;
    showLvlBanner();if(g.perkPts>0)setTimeout(togglePerks,700);
  }
  document.getElementById('sc').textContent=g.score;
}

function emitP(g,x,y,col,n,sp){
  n=n||8;sp=sp||3;
  for(let i=0;i<n;i++){const a=(Math.PI*2/n)*i+Math.random();const s=.5+Math.random()*sp;g.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,col,sz:2+Math.random()*3});}
}

function addFloat(g,t,x,y,c){g.floats.push({txt:t,x,y,col:c,life:1,vy:-1.3});}

// ── PERK UI ────────────────────────────────────────────────────
function buildPerkUI(){
  if(!G.curClass)return;
  const cls=CLASSES[G.curClass];
  const cols=document.getElementById('pcols');cols.innerHTML='';
  cls.perks.forEach(tree=>{
    const col=document.createElement('div');col.className='pcol';
    const title=document.createElement('div');title.className='pctitle';
    title.style.cssText=`background:${tree.col}18;color:${tree.col};border:1px solid ${tree.col}33`;
    title.textContent=tree.tree;col.appendChild(title);
    tree.perks.forEach(p=>{
      const rm=p.req.every(r=>G.owned.has(r)),ow=G.owned.has(p.id),cb=!ow&&rm&&G.perkPts>0;
      const node=document.createElement('div');node.className='pnode '+(ow?'ow':cb?'av':'');
      node.innerHTML=`<div class="pnode-nm">${p.name}</div><div class="pnode-ds">${p.desc}</div><div class="pnode-ct">${ow?'✓':'1pt'}</div>`;
      if(cb)node.onclick=()=>buyPerk(p.id);col.appendChild(node);
    });cols.appendChild(col);
  });
  const ug=document.getElementById('ugrid');ug.innerHTML='';
  cls.ultimates.forEach((u,i)=>{
    const unlocked=G.unlockedUlts.has(u.id);
    const cd=G.ultCds[i];
    const canBuy=!unlocked&&G.perkPts>=2;
    const card=document.createElement('div');
    card.className='ucard '+(unlocked?'ul':'lk');
    card.style.cursor=canBuy?'pointer':'default';
    let statusLine='';
    if(unlocked){
      statusLine=cd>0
        ?`<div style="color:#888;font-size:8px">CD: ${Math.ceil(cd/60)}s remaining</div>`
        :`<div style="color:#97c459;font-size:8px">KEY [${i+1}] — READY</div>`;
    } else {
      statusLine=canBuy
        ?`<div style="color:#f5c842;font-size:8px;margin-top:3px">CLICK TO UNLOCK (2 pts)</div>`
        :`<div style="color:#555;font-size:8px;margin-top:3px">LOCKED — costs 2 perk pts</div>`;
    }
    card.innerHTML=`<div class="ucard-nm" style="color:${unlocked?u.col:'#555'}">${unlocked?'⚡ ':'🔒 '}${u.name}</div><div class="ucard-req" style="color:${unlocked?'#888':'#444'}">Key [${i+1}] · cd: ${Math.ceil(u.cd/60)}s</div><div class="ucard-ds">${u.desc}</div>${statusLine}`;
    if(canBuy)card.onclick=()=>buyUlt(u.id);
    ug.appendChild(card);
  });
  document.getElementById('ppel').textContent=G.perkPts;
}

function togglePerks(){
  const pov=document.getElementById('pov');
  const on=pov.classList.contains('on');
  pov.classList.toggle('on',!on);
  document.getElementById('ptitle').textContent=G.perkPts>0?`✦ LEVEL UP — ${G.perkPts} POINT${G.perkPts>1?'S':''} TO SPEND ✦`:'✦ SKILL TREE ✦';
  buildPerkUI();
}

function buyPerk(id){
  if(G.perkPts<=0)return;
  G.owned.add(id);G.perkPts--;buildPerkUI();
  if(G.perkPts===0)setTimeout(()=>{document.getElementById('pov').classList.remove('on');},300);
}

function buyUlt(id){
  if(G.perkPts<2)return;
  G.unlockedUlts.add(id);G.perkPts-=2;
  buildPerkUI();
  if(G.perkPts===0)setTimeout(()=>{document.getElementById('pov').classList.remove('on');},300);
}

function showLvlBanner(){
  const b=document.getElementById('lvlb');
  b.textContent='✦ LEVEL '+G.level+' — SKILL POINT EARNED ✦';
  b.style.display='block';setTimeout(()=>b.style.display='none',1800);
}

// ── COLLISION ──────────────────────────────────────────────────
function collide(obj){
  obj.grounded=false;
  for(const pl of PLATS){if(obj.x+obj.w>pl.x&&obj.x<pl.x+pl.w&&obj.y+obj.h>pl.y&&obj.y+obj.h<pl.y+pl.h+14&&obj.vy>=0){obj.y=pl.y-obj.h;obj.vy=0;obj.grounded=true;}}
}

// ── INPUT ──────────────────────────────────────────────────────
const KEYS={};
document.addEventListener('keydown',e=>{
  KEYS[e.code]=true;
  if(['Space','ArrowUp','ArrowLeft','ArrowRight','ArrowDown'].includes(e.code))e.preventDefault();
  if(e.code==='KeyP'){togglePerks();return;}
  if(document.getElementById('pov').classList.contains('on'))return;
  if(!G.running)return;
  if(e.code==='Digit1')tryCast(0);
  if(e.code==='Digit2')tryCast(1);
  if(e.code==='Digit3')tryCast(2);
  if(e.code==='Digit4')tryCast(3);
  if(e.code==='Digit6')fireUlt(0);
  if(e.code==='Digit7')fireUlt(1);
});
document.addEventListener('keyup',e=>{KEYS[e.code]=false;});
CV.addEventListener('click',()=>CV.focus());
document.getElementById('rb').addEventListener('click',()=>{
  if(!G.curClass){document.getElementById('csel').style.display='flex';return;}
  resetAndStart();
});

function tryCast(i){
  const p=G.player,cls=CLASSES[G.curClass];
  const ab=cls.abilities[i];
  if(p.cds[i]>0)return;
  // Check resource — skip deduction if cost is 0
  if(ab.cost>0){
    if(p.res<ab.cost)return;
    // Cowboy Grit: 15% chance free shot
    const freeShot=G.curClass==='cowboy'&&i===0&&Math.random()<0.15;
    if(!freeShot)p.res-=ab.cost;
    if(freeShot)addFloat(G,'FREE SHOT!',p.x+p.w/2,p.y-20,'#f5c842');
  }
  let actualCd=ab.cd;
  if(G.curClass==='wizard') actualCd=Math.round(ab.cd*0.85); // Arcane Mastery
  if(G.curClass==='cowboy'&&G.owned.has('cr3')&&i===0) actualCd=Math.max(5,ab.cd-5);
  if(G.curClass==='jedi'&&G.owned.has('fd1')&&i===3) actualCd=Math.max(20,ab.cd-15);
  if(G.curClass==='cleric'&&G.owned.has('cw2')&&i===2) actualCd=Math.max(30,ab.cd-20);
  if(G.curClass==='cyborg'&&G.owned.has('cm2_c')&&i===2) actualCd=Math.max(30,ab.cd-20);
  p.cds[i]=actualCd;
  p.castAnim=18;p.castCol=cls.col;
  ab.cast(p,G);
}

function fireUlt(slot){
  if(!G.running)return;
  const cls=CLASSES[G.curClass];
  if(slot>=cls.ultimates.length)return;
  const u=cls.ultimates[slot];
  if(!G.unlockedUlts.has(u.id)){addFloat(G,'LOCKED — spend perk pts',W/2,H/2-30,'#888');return;}
  if(G.ultCds[slot]>0)return;
  G.ultCds[slot]=u.cd;
  G.player.castAnim=40;G.player.castCol=u.col;
  emitP(G,G.player.x+G.player.w/2,G.player.y+G.player.h/2,u.col,30,6);
  u.exec(G.player,G);
  buildPerkUI();
}

// ── GAME INIT ──────────────────────────────────────────────────
function resetAndStart(){
  const cls=CLASSES[G.curClass];
  G.player=mkPlayer(cls);
  G.projs=[];G.enemies=[];G.parts=[];G.floats=[];G.traps=[];
  G.stormTick=0;G.spawnTimer=0;G.spawnDelay=0;G.tick=0;
  G.wave=1;G.score=0;G.level=1;G.xp=0;G.xpNext=80;G.perkPts=0;
  G.owned=new Set();G.ultCds=[0,0];G.unlockedUlts=new Set();
  G.swingAnim=null;G.lassoAnim=null;G.shadowClones=[];G.smokeCloud=null;G.holyAura=null;G.smiteBolt=null;G.dogmeats=[];G.pipScan=null;G.vatsSlow=0;G.slamRipple=null;G.crackedGround=null;
  G.running=true;
  document.getElementById('wv').textContent=1;
  document.getElementById('sc').textContent=0;
  document.getElementById('lv').textContent=1;
  document.getElementById('rb').textContent='[ Restart ]';
  // 5-second delay before first goblins appear
  G.spawnDelay = 300; // 300 ticks = 5 seconds at 60fps
  buildPerkUI();updateHUD();
}

// ── UPDATE ─────────────────────────────────────────────────────
function update(){
  if(!G.running||document.getElementById('pov').classList.contains('on'))return;
  G.tick++;const p=G.player,cls=CLASSES[G.curClass];
  if(p.inv>0)p.inv--;
  if(p.burn>0){p.burn--;if(G.tick%25===0&&p.burn>0){p.hp=Math.max(1,p.hp-2);addFloat(G,'-2',p.x+p.w/2,p.y-8,'#ff8800');}}
  if(p.warcry>0)p.warcry--;
  if(p._rampage>0){p._rampage--;}
  // Vault Dweller
  if(p._stimBoost>0){p._stimBoost--;}
  if(p._adrenaline>0){p._adrenaline--;if(G.tick%60===0)p.res=Math.min(p.maxRes,p.res+10);}
  if(G.vatsSlow>0){G.vatsSlow--;}
  // Gorilla: build rage when hit (handled in touch damage)
  // Cyborg passive: power regens faster + gains from being hit (handled below)
  if(G.curClass==='cyborg'&&G.tick%30===0&&p.res<p.maxRes) p.res=Math.min(p.maxRes,p.res+4);
  if(G.curClass==='gorilla'&&G.tick%40===0&&p.res<p.maxRes) p.res=Math.min(p.maxRes,p.res+2);
  // Jedi deflect tick
  if(p.deflecting>0){
    p.deflecting--;
    // Force Counter perk: damage nearby enemies each tick
    if(G.owned.has('fd3')&&G.tick%8===0){
      G.enemies.forEach(e=>{if(e.alive&&Math.hypot(e.x+e.w/2-p.x-p.w/2,e.y+e.h/2-p.y-p.h/2)<55){hurtE(G,e,6,'#00e5ff');}});
    }
  }
  // Resource regen
  if(G.curClass==='wizard'){if(G.tick%24===0&&p.res<p.maxRes)p.res=Math.min(p.maxRes,p.res+6+G.level);}  // 2x regen
  else if(G.curClass!=='cowboy'){if(G.tick%48===0&&p.res<p.maxRes)p.res=Math.min(p.maxRes,p.res+5+G.level);}
  p.cds=p.cds.map(c=>Math.max(0,c-1));
  G.ultCds=G.ultCds.map(c=>Math.max(0,c-1));
  if(p.castAnim>0)p.castAnim--;

  // Spawn goblins — with initial countdown delay
  if(G.spawnDelay>0){
    G.spawnDelay--;
  } else {
    G.spawnTimer++;
    const alive=G.enemies.filter(e=>e.alive).length;
    const interval=Math.max(45,140-G.wave*8);
    const maxG=Math.min(4+G.wave*2,24);
    if(G.spawnTimer>=interval&&alive<maxG){
      G.spawnTimer=0;
      const go=spawnEnemy();
      go.x=Math.random()<.5 ? 0 : W-go.w; // spawn at screen edge
      G.enemies.push(go);
      if(G.wave>=6&&Math.random()<.25){
        const go2=spawnEnemy();
        go2.x=Math.random()<.5 ? 0 : W-go2.w;
        G.enemies.push(go2);
      }
    }
  }
  const kills=G.enemies.filter(e=>!e.alive).length;
  const nw=Math.floor(kills/30)+1;
  if(nw>G.wave){G.wave=nw;document.getElementById('wv').textContent=G.wave;
    addFloat(G,'WAVE '+G.wave+'!',W/2,H/2-40,'#97c459');
    const warnMap={3:'⚔ SKELETONS RISE!',5:'💪 ORCS INCOMING!',7:'⚰ MUMMIES AWAKEN!',8:'🕷 SPIDERS EMERGE!',9:'🐺 WEREWOLVES HOWL!',10:'🧛 VAMPIRES STALK!',12:'👹 TROLLS MARCH!',14:'🗿 GOLEMS AWAKEN!'};
    if(warnMap[G.wave])setTimeout(()=>{if(G.running)addFloat(G,warnMap[G.wave],W/2,H/2-65,'#f5c842');},900);
    p.hp=Math.min(p.maxHp,p.hp+15);p.res=Math.min(p.maxRes,p.res+20);}
  // Storm
  if(G.stormTick>0){G.stormTick--;if(G.tick%14===0){const tgt=G.enemies.filter(e=>e.alive).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y))[0];if(tgt){tgt.stunned=20;hurtE(G,tgt,28,'#f5c842');addFloat(G,'-28',tgt.x,tgt.y-8,'#f5c842');}}}

  // Player move
  const left=KEYS['ArrowLeft']||KEYS['KeyA'],right=KEYS['ArrowRight']||KEYS['KeyD'],jump=KEYS['ArrowUp']||KEYS['KeyW']||KEYS['Space'];
  const ninjaBoost=G.curClass==='ninja'?1.15:1.0;
  const spd=(p.warcry>0?5.2:4.3)*ninjaBoost;
  if(left){p.vx=-spd;p.facing=-1;}else if(right){p.vx=spd;p.facing=1;}else p.vx*=.75;
  if(jump)p.jb=6;if(p.jb>0)p.jb--;
  if(p.grounded&&p.jb>0){p.vy=-13;p.grounded=false;p.jb=0;}
  p.vy+=GV;if(p.vy>16)p.vy=16;
  p.x+=p.vx;p.x=Math.max(0,Math.min(W-p.w,p.x));
  collide(p);p.y+=p.vy;
  if(p.y>H+80)p.hp=0;
  p.ft++;if(p.ft>7){p.frame=(p.frame+1)%4;p.ft=0;}
  if(G.enemies.length>200)G.enemies=G.enemies.filter(e=>e.alive);

  // Traps
  G.traps=G.traps.filter(trap=>{
    trap.t++;if(trap.armed>0){trap.armed--;return true;}
    const hit=G.enemies.some(e=>e.alive&&Math.hypot(e.x+e.w/2-trap.x,e.y+e.h/2-trap.y)<trap.radius*.6);
    if(hit){
      G.enemies.forEach(e=>{if(e.alive&&Math.hypot(e.x+e.w/2-trap.x,e.y+e.h/2-trap.y)<trap.radius){hurtE(G,e,trap.dmg,trap.col);e.stunned=60;}});
      emitP(G,trap.x,H-T-10,trap.col,30,6);addFloat(G,'BOOM!',trap.x,H-T-20,trap.col);
      return false;
    }
    return trap.t<600;
  });

  // Projectiles
  G.projs=G.projs.filter(pr=>{
    pr.trail.push({x:pr.x,y:pr.y});if(pr.trail.length>10)pr.trail.shift();
    pr.x+=pr.vx;pr.y+=pr.vy;
    // Saber throw: keep piercing on the way out AND back
    if(pr.isSaber){
      pr.returnTimer--;
      if(pr.returnTimer<=0){
        pr.vx*=-1;pr.vy*=-1;
        pr.isSaber=false; // stop reversing again
        pr.pierce=true;   // still pierces on return trip
        pr.returning=true;
      }
    }
    if(!pr.noGrav&&!pr.isMeteor&&pr.type!=='arrow'&&!pr.isSaber)pr.vy+=.07;
    if(pr.type==='arrow'&&!pr.rainArrow){/* arrows travel flat */}
    if(pr.rainArrow){pr.vy+=.18;} // rain arrows accelerate downward
    pr.life-=.013;
    if(pr.x<-50||pr.x>W+50||pr.y>H+50||pr.life<=0)return false;

    // Dynamite — explodes on ground or wall
    if(pr.isDynamite&&pr.y>=H-T-pr.radius){
      G.enemies.forEach(e=>{if(e.alive&&Math.hypot(e.x+e.w/2-pr.x,e.y+e.h/2-pr.y)<pr.dRad){hurtE(G,e,pr.dmg,pr.color);e.stunned=60;}});
      emitP(G,pr.x,pr.y,pr.color,30,6);addFloat(G,'BOOM!',pr.x,pr.y-10,pr.color);
      return false;
    }

    let destroyProj=false;
    // Bananas and rocket fists have their own collision below — skip normal loop
    if(!pr.isBanana&&!pr.isRocketFist)
    for(const e of G.enemies){
      if(!e.alive)continue;
      if(e.marked&&e.markedTimer>0){e.markedTimer--;if(e.markedTimer<=0)e.marked=false;}
      const isArrow=(pr.type==='arrow');
      const isShuriken=(pr.type==='shuriken');
      const isBullet=(pr.type==='bullet'&&!pr.isEnemyProj);
      // Bullets and arrows use rect-based hit detection so they reliably connect
      const hitW=isArrow?e.w+8:isShuriken?e.w+6:isBullet?e.w+6:pr.radius+e.w/2;
      const hitH=isArrow?e.h+6:isShuriken?e.h+4:isBullet?e.h+4:pr.radius+e.w/2;
      const useRect=isArrow||isShuriken||isBullet;
      const dist=useRect
        ?Math.max(Math.abs(pr.x-(e.x+e.w/2))-hitW/2,0)+Math.max(Math.abs(pr.y-(e.y+e.h/2))-hitH/2,0)
        :Math.hypot(pr.x-(e.x+e.w/2),pr.y-(e.y+e.h/2));
      if(dist>(useRect?1:pr.radius+e.w/2))continue;
      let dmg=pr.dmg;
      if(pr.type==='arrow'&&e.marked)dmg=Math.round(dmg*(G.owned.has('rv2')?4:3));
      if(pr.type==='ice'&&e.frozen>0&&G.owned.has('wi2'))dmg*=2;
      if(pr.type==='ice')e.frozen=G.owned.has('wi1')?280:140;
      if(pr.type==='plasma'&&G.owned.has('cy4'))e.burn=150;
      if(pr.type==='fire'&&G.owned.has('wf2')&&!pr.isSplit)e.burn=180;
      // Wizard inferno split
      if(pr.type==='fire'&&G.owned.has('wf3')&&!pr.isSplit&&!pr.isMeteor){
        const ba=Math.atan2(pr.vy,pr.vx);
        [-0.45,0,0.45].forEach(sp=>{const a=ba+sp;spawnProj(G,pr.x,pr.y,Math.cos(a)*7,Math.sin(a)*7,8,'#ff8800',Math.round(dmg*.55),'fire',{isSplit:true});});
        emitP(G,pr.x,pr.y,'#ff8800',16,4);hurtE(G,e,dmg,pr.color);destroyProj=true;break;
      }
      // Meteor AoE
      if(pr.isMeteor){
        G.enemies.forEach(e2=>{if(e2.alive&&Math.hypot(e2.x-pr.x,e2.y-pr.y)<pr.radius+28)hurtE(G,e2,pr.dmg*.65,pr.color);});
        emitP(G,pr.x,pr.y,'#ff4400',40,8);destroyProj=true;break;
      }
      // Dynamite AoE
      if(pr.isDynamite){
        G.enemies.forEach(e2=>{if(e2.alive&&Math.hypot(e2.x+e2.w/2-pr.x,e2.y+e2.h/2-pr.y)<pr.dRad){hurtE(G,e2,pr.dmg,pr.color);e2.stunned=60;}});
        emitP(G,pr.x,pr.y,pr.color,30,6);addFloat(G,'BOOM!',pr.x,pr.y-10,pr.color);destroyProj=true;break;
      }
      hurtE(G,e,dmg,pr.color);
      // Shuriken poisons on perk
      if(pr.isShuriken&&G.owned.has('np2'))e.burn=120;
      if(!pr.pierce){destroyProj=true;break;}
    }
    // Banana: on hitting enemy, slip (stun) and optional burn
    if(!destroyProj&&pr.isBanana){
      for(const e of G.enemies){
        if(!e.alive)continue;
        const dist=Math.hypot(pr.x-(e.x+e.w/2),pr.y-(e.y+e.h/2));
        if(dist<pr.radius+e.w/2){
          hurtE(G,e,pr.dmg,'#f5c842');
          e.stunned=pr.slipDur||110;
          e.vx*=0.1; // slip: lose momentum
          if(pr.doBurn)e.burn=120;
          emitP(G,pr.x,pr.y,'#f5c842',12,4);
          addFloat(G,'SLIPPED!',e.x+e.w/2,e.y-10,'#f5c842');
          destroyProj=true;break;
        }
      }
      // Also explode on ground
      if(!destroyProj&&pr.y>=H-T-pr.radius){
        emitP(G,pr.x,pr.y,'#f5c842',10,3);
        destroyProj=true;
      }
    }
    // Rocket fist: explodes on hitting anything
    if(!destroyProj&&pr.isRocketFist){
      let fistHit=false;
      for(const e of G.enemies){
        if(!e.alive)continue;
        if(Math.hypot(pr.x-(e.x+e.w/2),pr.y-(e.y+e.h/2))<pr.radius+e.w/2){fistHit=true;break;}
      }
      if(fistHit||pr.y>=H-T){
        G.enemies.forEach(e=>{if(e.alive&&Math.hypot(e.x+e.w/2-pr.x,e.y+e.h/2-pr.y)<pr.dRad){hurtE(G,e,pr.dmg,'#ff8800');e.vx=(e.x-pr.x)/Math.max(1,Math.hypot(e.x-pr.x,e.y-pr.y))*14;e.vy=-8;e.stunned=60;if(G.owned.has('cx4'))e.burn=150;}});
        emitP(G,pr.x,pr.y,'#ff8800',28,7);addFloat(G,'BOOM!',pr.x,pr.y-10,'#ff8800');
        G.slamRipple={x:pr.x,y:pr.y,r:0,maxR:pr.dRad,t:20,col:'#ff8800'};
        destroyProj=true;
      }
    }
    // Enemy projectiles hit the player
    if(pr.isEnemyProj&&!destroyProj){
      if(Math.hypot(pr.x-(p.x+p.w/2),pr.y-(p.y+p.h/2))<pr.radius+p.w/2){
        let dmg=pr.dmg;
        if(G.curClass==='vault')dmg=Math.round(dmg*.85);
        if(G.curClass==='knight'){dmg=Math.round(dmg*.80);G.player.res=Math.min(G.player.maxRes,G.player.res+8);}
        if(G.curClass==='jedi')dmg=Math.round(dmg*.90);
        if(G.curClass==='gorilla'){G.player.res=Math.min(G.player.maxRes,G.player.res+5);}
        if(G.curClass==='cyborg'){G.player.res=Math.min(G.player.maxRes,G.player.res+8);}
        // Cleric ward
        if(p.wardCharges>0){
          p.wardCharges--;addFloat(G,'WARD! ('+p.wardCharges+' left)',p.x+p.w/2,p.y-28,'#88aaff');
          if(G.owned.has('cw3')){G.enemies.forEach(e2=>{if(e2.alive&&Math.hypot(e2.x-p.x,e2.y-p.y)<60)hurtE(G,e2,30,'#88aaff');});}
          if(G.owned.has('cw4')){/* reflect doesn't apply to ranged */}
          emitP(G,p.x+p.w/2,p.y+p.h/2,'#88aaff',10,3);dmg=0;
        }
        // Jedi deflect reflects enemy projectiles
        if(p.deflecting>0&&p.inv>0){
          pr.vx*=-1;pr.vy*=-1;pr.isEnemyProj=false;pr.dmg=dmg*2;
          addFloat(G,'REFLECTED!',p.x+p.w/2,p.y-28,'#00e5ff');
          return !destroyProj;
        }
        if(p.inv===0){
          p.hp-=dmg;p.inv=50;
          emitP(G,p.x+p.w/2,p.y+p.h/2,'#e24b4a',8,3);
          if(dmg>0)addFloat(G,'-'+dmg,p.x,p.y-8,'#e24b4a');
        }
        return false;
      }
    }
    return !destroyProj;
  });

  // Enemy AI
  G.enemies.forEach(e=>{
    if(!e.alive)return;
    if(e.dmgFlash>0)e.dmgFlash--;
    if(e.burn>0){e.burn--;if(G.tick%20===0)hurtE(G,e,3,'#e8820a');}
    // Troll regen: slowly recover HP
    if(e.regenerates&&e.hp>0&&e.hp<e.maxHp&&G.tick%60===0){e.hp=Math.min(e.maxHp,e.hp+8);e.dmgFlash=3;}
    // Werewolf pounce: if within range, leap at player occasionally
    if(e.pounces&&e.grounded&&Math.random()<0.008){
      const dx=G.player.x+G.player.w/2-(e.x+e.w/2);
      if(Math.abs(dx)<320){e.vx=dx>0?14:-14;e.vy=-12;}
    }
    // Spider venom: on contact applies extra burn
    // (handled in touch section below via venomous flag)
    // Golem stomp: periodic screen-shake style AoE
    if(e.isGolem&&e.grounded&&G.tick%180===0){
      G.enemies.forEach(()=>{}); // placeholder — AoE in touch section
      G.slamRipple={x:e.x+e.w/2,y:e.y+e.h,r:0,maxR:80,t:20,col:e.isLava?'#ff4400':'#888878'};
    }
    if(e.frozen>0){e.frozen--;return;}if(e.stunned>0){e.stunned--;return;}
    const dir=p.x>e.x?1:-1;
    let eSpd=e.spd;if(e.berserk&&e.hp<e.maxHp*.5)eSpd*=1.8;
    if(G.vatsSlow>0)eSpd*=0.3;
    // Jedi Force Sense: slow enemies within 120px
    if(G.curClass==='jedi'&&Math.hypot(e.x+e.w/2-(p.x+p.w/2),e.y+e.h/2-(p.y+p.h/2))<120)eSpd*=0.80;
    // Ranged enemies: keep distance and shoot
    if(e.isRanged){
      const distToP=Math.hypot(e.x+e.w/2-(p.x+p.w/2),e.y+e.h/2-(p.y+p.h/2));
      const prefDist=e.shootRange*.55;
      // Keep preferred distance
      if(distToP<prefDist*0.7) e.vx=(-dir)*eSpd; // too close, back off
      else if(distToP>prefDist*1.3) e.vx=dir*eSpd*0.7; // too far, close in
      else e.vx=0; // in sweet spot
      // Shoot at player
      if(e.shootCd>0) e.shootCd--;
      else if(distToP<e.shootRange&&e.grounded){
        e.shootCd=e.shootRate;
        const dx=p.x+p.w/2-(e.x+e.w/2),dy=p.y+p.h/2-(e.y+e.h/2);
        const len=Math.hypot(dx,dy)||1;
        const spd=e.isDarkWiz?7:e.isOrcShaman?6:8;
        const projCol=e.isDarkWiz?'#cc44ff':e.isOrcShaman?'#80ff40':e.isSkelArcher?'#d4cbb0':'#ff8800';
        const projType=e.isDarkWiz?'enemySpell':e.isOrcShaman?'enemySpell':'enemyArrow';
        const pSize=e.isDarkWiz?9:e.isOrcShaman?8:5;
        spawnProj(G,e.x+e.w/2,e.y+e.h*.4,dx/len*spd,dy/len*spd,pSize,projCol,e.dmg,projType,{isEnemyProj:true,noGrav:e.isDarkWiz||e.isOrcShaman});
        emitP(G,e.x+e.w/2,e.y+e.h*.4,projCol,6,2);
      }
    } else {
      e.vx=e.shaman&&Math.abs(e.x-p.x)<130?eSpd*(-dir):eSpd*dir;
    }
    e.vy+=GV;if(e.vy>16)e.vy=16;e.x+=e.vx;collide(e);e.y+=e.vy;
    e.x=Math.max(-85,Math.min(W+85,e.x));
    e.ft++;if(e.ft>8){e.fr=(e.fr+1)%4;e.ft=0;}
    if(e.grounded&&Math.random()<.012&&!e.isRanged)e.vy=-10;
    const dr=G.owned.has('kb4')?.7:1;
    if(p.inv===0&&Math.abs(e.x+e.w/2-(p.x+p.w/2))<(e.w+p.w)/2&&Math.abs(e.y+e.h/2-(p.y+p.h/2))<(e.h+p.h)/2){
      let actualDmg=Math.round(e.dmg*dr);
      // Passive damage modifiers
      if(G.curClass==='vault')actualDmg=Math.round(actualDmg*.85);
      if(G.curClass==='knight'){actualDmg=Math.round(actualDmg*.80);p.res=Math.min(p.maxRes,p.res+8);} // Iron Will
      if(G.curClass==='jedi'){actualDmg=Math.round(actualDmg*.90);} // Force Sense
      if(G.curClass==='gorilla'){p.res=Math.min(p.maxRes,p.res+5);}
      if(G.curClass==='cyborg'){p.res=Math.min(p.maxRes,p.res+8);}
      // Jedi deflect
      if(p.deflecting>0){
        const reflectDmg=G.owned.has('fd4')?actualDmg*3:actualDmg;
        hurtE(G,e,reflectDmg,'#00e5ff');
        actualDmg=Math.round(actualDmg*0.2);
        addFloat(G,'DEFLECTED!',p.x+p.w/2,p.y-28,'#00e5ff');
      }
      // Cleric holy ward
      if(p.wardCharges>0){
        p.wardCharges--;
        addFloat(G,'WARD! ('+(p.wardCharges)+' left)',p.x+p.w/2,p.y-28,'#88aaff');
        if(p.wardRetribution||G.owned.has('cw3')){
          G.enemies.forEach(e2=>{if(e2.alive&&Math.hypot(e2.x-p.x,e2.y-p.y)<60)hurtE(G,e2,30,'#88aaff');});
        }
        if(G.owned.has('cw4')){hurtE(G,e,Math.round(actualDmg*.5),'#88aaff');}
        if(G.owned.has('cm4_c')){hurtE(G,e,Math.round(actualDmg*3),'#00e5ff');}
        emitP(G,p.x+p.w/2,p.y+p.h/2,'#88aaff',10,3);
        actualDmg=0;
      }

// ── HUD ────────────────────────────────────────────────────────
function updateHUD(){
  const p=G.player;if(!p)return;
  const cls=CLASSES[G.curClass];
  document.getElementById('hf').style.width=Math.max(0,p.hp/p.maxHp*100)+'%';
  document.getElementById('mf').style.width=Math.max(0,p.res/p.maxRes*100)+'%';
  document.getElementById('xf').style.width=Math.min(100,G.xp/G.xpNext*100)+'%';
  const sb=document.getElementById('sb');sb.innerHTML='';
  cls.abilities.forEach((ab,i)=>{
    const cd=p.cds[i],rdy=cd===0;
    const d=document.createElement('div');d.className='ss'+(rdy?' rdy':'');
    d.innerHTML=`<div class="sk" style="color:${cls.col}">[${cls.abilityKeys[i]}]</div><div style="font-size:9px">${ab.name}</div><div>${cd>0?Math.ceil(cd/20)+'s':'ready'}</div>`;
    sb.appendChild(d);
  });
  cls.ultimates.forEach((u,i)=>{
    const unlocked=G.unlockedUlts.has(u.id);
    const cd=G.ultCds[i],rdy=cd===0&&unlocked;
    const d=document.createElement('div');
    d.className='ss ult'+(rdy?' rdy':'');
    if(!unlocked)d.style.opacity='0.45';
    const statusTxt=!unlocked?'LOCKED':cd>0?Math.ceil(cd/60)+'s':'READY';
    d.innerHTML=`<div class="sk" style="color:${u.col}">[${i+1}]</div><div style="font-size:9px">${u.name}</div><div style="font-size:9px">${unlocked?'':'🔒 '}${statusTxt}</div>`;
    sb.appendChild(d);
  });
}

function drawUndead(e){
  if(!e.alive)return;
  CX.save();CX.translate(e.x+e.w/2,e.y+e.h/2);if(e.vx>=0)CX.scale(-1,1);
  const bob=e.grounded?Math.sin(e.fr*Math.PI/2)*2:0;
  const fl=e.dmgFlash>0,fr=e.frozen>0,bu=e.burn>0;
  const h=e.h,hw=e.w;
  if(e.isMummy){
    // Mummy — wrapped bandages
    const bc=fr?'#85b7eb':fl?'#fff':bu?'#ff8800':e.col;
    CX.fillStyle=bc;CX.fillRect(-hw/2,-h/2+8+bob,hw,h-8);
    // Bandage wraps
    CX.strokeStyle=e.ancient?'#c8a050':'#d8c090';CX.lineWidth=2;CX.globalAlpha=.7;
    for(let wy=-h/2+10;wy<h/2-4;wy+=6+bob*.1){CX.beginPath();CX.moveTo(-hw/2+1,wy+bob);CX.lineTo(hw/2-1,wy+bob);CX.stroke();}
    CX.globalAlpha=1;
    // Head
    CX.fillStyle=bc;CX.beginPath();CX.ellipse(0,-h/2+5+bob,hw/2,hw/2+1,0,0,Math.PI*2);CX.fill();
    // Head wraps
    CX.strokeStyle=e.ancient?'#c8a050':'#d8c090';CX.lineWidth=2;
    CX.beginPath();CX.arc(0,-h/2+5+bob,hw/2+1,-.6,Math.PI+.6);CX.stroke();
    // Glowing eyes
    const ec=fr?'#aaddff':fl?'#fff':e.eye;
    CX.fillStyle=ec;CX.beginPath();CX.arc(-3,-h/2+4+bob,2,0,Math.PI*2);CX.fill();
    CX.beginPath();CX.arc(3,-h/2+4+bob,2,0,Math.PI*2);CX.fill();
    // Crown for lord
    if(e.lord){CX.fillStyle='#f5c842';CX.beginPath();CX.moveTo(-8,-h/2+bob);CX.lineTo(-6,-h/2-8+bob);CX.lineTo(-2,-h/2-4+bob);CX.lineTo(0,-h/2-10+bob);CX.lineTo(2,-h/2-4+bob);CX.lineTo(6,-h/2-8+bob);CX.lineTo(8,-h/2+bob);CX.closePath();CX.fill();}
    // Arm reaching out
    const lob=e.grounded?Math.sin(e.fr*Math.PI/2)*4:0;
    CX.fillStyle=bc;CX.fillRect(hw/2-1,bob-4,10,6+lob);
    CX.strokeStyle=e.ancient?'#c8a050':'#d8c090';CX.lineWidth=1.5;CX.beginPath();CX.moveTo(hw/2+8,bob-2+lob);CX.lineTo(hw/2+14,bob+2+lob);CX.stroke();
  } else {
    // Skeleton
    const bc=fr?'#85b7eb':fl?'#fff':e.col;
    // Ribcage body
    CX.fillStyle=bc;
    for(let ri=0;ri<4;ri++){CX.beginPath();CX.ellipse(0,-h/2+14+ri*5+bob,hw/2-2,2,0,0,Math.PI*2);CX.fill();}
    // Spine
    CX.strokeStyle=bc;CX.lineWidth=3;CX.beginPath();CX.moveTo(0,-h/2+8+bob);CX.lineTo(0,h/2-8+bob);CX.stroke();
    // Pelvis

  for(let fy=bob-h/3;fy<bob+h/3;fy+=5){for(let fx=-hw/2;fx<hw/2;fx+=6){CX.beginPath();CX.moveTo(fx,fy);CX.lineTo(fx+3,fy-3);CX.stroke();}}
  // Head — wolf snout

  // Snout

  CX.beginPath();CX.moveTo(-8,-h/2+bob);CX.lineTo(-12,-h/2-10+bob);CX.lineTo(-3,-h/2+bob);CX.closePath();CX.fill();
  CX.beginPath();CX.moveTo(1,-h/2+bob);CX.lineTo(4,-h/2-9+bob);CX.lineTo(7,-h/2+bob);CX.closePath();CX.fill();

function drawSpider(e){
  if(!e.alive)return;
  CX.save();CX.translate(e.x+e.w/2,e.y+e.h/2);
  const bob=e.grounded?Math.sin(e.fr*Math.PI/2)*1.5:0;
  const fl=e.dmgFlash>0,fr=e.frozen>0,bu=e.burn>0;
  const h=e.h,hw=e.w;
  const bc=fr?'#85b7eb':fl?'#fff':bu?'#ff8800':e.col;
  // 8 legs (4 each side)
  const legAngles=[.4,.7,1.0,1.3];
  [-1,1].forEach(side=>{
    legAngles.forEach((ang,i)=>{
      const legBob=Math.sin(G.tick*.2+i)*4;
      CX.strokeStyle=fr?'#7090a8':bc;CX.lineWidth=2;
      CX.beginPath();CX.moveTo(side*hw/3,bob);CX.lineTo(side*(hw/2+hw/3),bob+4+legBob);CX.lineTo(side*(hw/2+hw/2),bob+h/2+legBob);CX.stroke();
    });
  });
  // Abdomen
  CX.fillStyle=bc;CX.beginPath();CX.ellipse(0,bob+4,hw/3,h/2,0,0,Math.PI*2);CX.fill();
  // Hourglass on abdomen for venom spider
  if(e.venomous){CX.fillStyle='#ff0000';CX.beginPath();CX.moveTo(-4,bob+2);CX.lineTo(0,bob+6);CX.lineTo(4,bob+2);CX.closePath();CX.fill();CX.beginPath();CX.moveTo(-4,bob+10);CX.lineTo(0,bob+6);CX.lineTo(4,bob+10);CX.closePath();CX.fill();}
  // Head
  CX.fillStyle=bc;CX.beginPath();CX.ellipse(0,bob-h/3,hw/4,hw/5,0,0,Math.PI*2);CX.fill();
  // 8 eyes
  const ec=fr?'#aaddff':e.queen?'#ff44ff':e.venomous?'#00ff44':'#ff4400';
  for(let ex2=-3;ex2<=3;ex2+=2){CX.fillStyle=ec;CX.beginPath();CX.arc(ex2,bob-h/3-2,1.5,0,Math.PI*2);CX.fill();}
  // Mandibles
  CX.strokeStyle=fr?'#7090a8':'#3a3a1a';CX.lineWidth=1.5;
  CX.beginPath();CX.moveTo(-3,bob-h/3+4);CX.lineTo(-6,bob-h/3+8);CX.stroke();
  CX.beginPath();CX.moveTo(3,bob-h/3+4);CX.lineTo(6,bob-h/3+8);CX.stroke();
  // Queen crown
  if(e.queen){CX.fillStyle='#ff44ff';CX.font='10px sans-serif';CX.textAlign='center';CX.fillText('♛',0,bob-h/2-2);}
  if(e.hp<e.maxHp){CX.fillStyle='#1a0a00';CX.fillRect(-hw/2,-h/2-8,hw,4);CX.fillStyle=fr?'#85b7eb':e.venomous?'#00ff44':'#e24b4a';CX.fillRect(-hw/2,-h/2-8,hw*(e.hp/e.maxHp),4);}
  CX.globalAlpha=1;CX.textAlign='left';CX.restore();
}

function drawGolem(e){
  if(!e.alive)return;

  CX.strokeStyle=fr?'#aaddff':e.isLava?'#ff4400':'#888878';CX.lineWidth=2;CX.strokeRect(-hw/2,-h/2+6+bob,hw,h-6);

  CX.beginPath();CX.moveTo(-hw/3,h/4+bob);CX.lineTo(-hw/6,bob);CX.stroke();
  // Lava glow in cracks
  if(e.isLava){CX.strokeStyle=lavaGlow?'#ff4400':'#ff8800';CX.lineWidth=2;CX.beginPath();CX.moveTo(-hw/4,-h/4+bob);CX.lineTo(0,bob);CX.lineTo(hw/4,-h/6+bob);CX.stroke();}
  // Head — squared-off boulder
  CX.fillStyle=bc;CX.fillRect(-hw/2+2,-h/2+bob,hw-4,14);
  CX.strokeStyle=fr?'#aaddff':e.isLava?'#ff4400':'#888878';CX.lineWidth=1.5;CX.strokeRect(-hw/2+2,-h/2+bob,hw-4,14);

  CX.beginPath();CX.arc(-6,-h/2+7+bob,4,0,Math.PI*2);CX.fill();CX.beginPath();CX.arc(6,-h/2+7+bob,4,0,Math.PI*2);CX.fill();
  CX.globalAlpha=1;
  CX.fillStyle='#1a0a00';CX.beginPath();CX.arc(-6,-h/2+7+bob,2,0,Math.PI*2);CX.fill();CX.beginPath();CX.arc(6,-h/2+7+bob,2,0,Math.PI*2);CX.fill();
  // Stone fists
  CX.fillStyle=bc;CX.fillRect(hw/2-2,bob-6,hw/3+4,hw/3+4);CX.strokeStyle=fr?'#aaddff':'#888878';CX.lineWidth=1;CX.strokeRect(hw/2-2,bob-6,hw/3+4,hw/3+4);
  // Lava drips
  if(e.isLava){CX.fillStyle='#ff4400';for(let d=0;d<3;d++){const dx=(d-1)*8,dy=Math.sin(G.tick*.08+d)*6;CX.beginPath();CX.arc(dx,h/4+dy+bob,3,0,Math.PI*2);CX.fill();}}
  // Legs — stone slabs
  const lob=e.grounded?Math.sin(e.fr*Math.PI/2)*3:0;
  CX.fillStyle=bc;CX.fillRect(-hw/2+1,h/2-14+bob,hw/2-2,14+lob);CX.fillRect(1,h/2-14+bob,hw/2-2,14-lob);
  CX.strokeStyle=fr?'#aaddff':'#888878';CX.lineWidth=1;CX.strokeRect(-hw/2+1,h/2-14+bob,hw/2-2,14+lob);CX.strokeRect(1,h/2-14+bob,hw/2-2,14-lob);
  if(e.hp<e.maxHp){CX.fillStyle='#1a0a00';CX.fillRect(-hw/2,-h/2-9,hw,5);CX.fillStyle=fr?'#85b7eb':e.isLava?'#ff4400':'#e24b4a';CX.fillRect(-hw/2,-h/2-9,hw*(e.hp/e.maxHp),5);}
  CX.globalAlpha=1;CX.textAlign='left';CX.restore();
}

function drawEnemy(e){
  if(!e.alive)return;
  if(e.isRanged)drawRangedEnemy(e);
  else if(e.etype==='troll')drawTroll(e);
  else if(e.isVampire)drawVampire(e);
  else if(e.isWerewolf)drawWerewolf(e);
  else if(e.isSpider)drawSpider(e);
  else if(e.isGolem)drawGolem(e);
  else if(e.etype==='undead')drawUndead(e);
  else if(e.etype==='orc')drawOrc(e);
  else drawGoblin(e);
}

  else if(e.tier>=3){CX.fillStyle='#5a5040';CX.fillRect(-hw/2+1,-h/2+bob,hw-2,7);CX.fillStyle='#8a7050';CX.beginPath();CX.moveTo(-hw/2+2,-h/2+bob);CX.lineTo(-hw/2-4,-h/2-10+bob);CX.lineTo(-hw/2+5,-h/2+bob);CX.closePath();CX.fill();CX.beginPath();CX.moveTo(hw/2-2,-h/2+bob);CX.lineTo(hw/2+4,-h/2-10+bob);CX.lineTo(hw/2-5,-h/2+bob);CX.closePath();CX.fill();}

  CX.fillStyle=fr?'#5090c0':'#2a1a00';const lob=e.grounded?Math.sin(e.fr*Math.PI/2)*5:0;
  CX.fillRect(-hw/2+1,h/2-10+bob,hw/2-2,10+lob);CX.fillRect(1,h/2-10+bob,hw/2-2,10-lob);

  else{CX.beginPath();CX.moveTo(hw/2,bob-1);CX.lineTo(hw/2+10,bob+5);CX.stroke();CX.fillStyle='#5a3a10';CX.beginPath();CX.ellipse(hw/2+10,bob+6,4,3,.5,0,Math.PI*2);CX.fill();}
  if(e.hp<e.maxHp){CX.fillStyle='#1a0a00';CX.fillRect(-hw/2,-h/2-8,hw,4);CX.fillStyle=fr?'#85b7eb':bu?'#ff8800':'#e24b4a';CX.fillRect(-hw/2,-h/2-8,hw*(e.hp/e.maxHp),4);}
  if(e.marked&&e.markedTimer>0){CX.fillStyle='#97c459';CX.font='12px sans-serif';CX.textAlign='center';CX.fillText('🎯',0,-h/2-18);CX.textAlign='left';}

function drawProjs(){
  G.projs.forEach(pr=>{
    pr.trail.forEach((t,i)=>{CX.globalAlpha=(i/pr.trail.length)*.38*Math.min(pr.life,1);CX.fillStyle=pr.color;CX.beginPath();CX.arc(t.x,t.y,pr.radius*(i/pr.trail.length)*.7,0,Math.PI*2);CX.fill();});
    CX.globalAlpha=Math.min(pr.life,1);CX.fillStyle=pr.color;CX.beginPath();CX.arc(pr.x,pr.y,pr.radius,0,Math.PI*2);CX.fill();
    if(pr.type==='arrow'||pr.isDynamite){CX.fillStyle='#fff';CX.globalAlpha=Math.min(pr.life*.35,1);CX.beginPath();CX.arc(pr.x-pr.radius*.3,pr.y-pr.radius*.3,pr.radius*.35,0,Math.PI*2);CX.fill();}
    if(pr.isSaber){
      // Draw as lightsaber blade
      CX.save();
      const angle=Math.atan2(pr.vy,pr.vx);
      CX.translate(pr.x,pr.y);CX.rotate(angle);
      CX.shadowColor=pr.color;CX.shadowBlur=8;
      CX.strokeStyle=pr.color;CX.lineWidth=4;CX.globalAlpha=Math.min(pr.life,1);
      CX.beginPath();CX.moveTo(-18,0);CX.lineTo(18,0);CX.stroke();
      CX.strokeStyle='#fff';CX.lineWidth=1.5;
      CX.beginPath();CX.moveTo(-18,0);CX.lineTo(18,0);CX.stroke();
      CX.shadowBlur=0;CX.restore();
    }
    // Enemy spell glow
    if((pr.type==='enemySpell')&&!pr.isEnemyProj===false){
      CX.globalAlpha=Math.min(pr.life,.7);
      CX.fillStyle=pr.color;CX.beginPath();CX.arc(pr.x,pr.y,pr.radius*1.5,0,Math.PI*2);CX.fill();
    }
    CX.globalAlpha=1;
  });
}

function drawTraps(){
  G.traps.forEach(trap=>{
    if(trap.armed>0){
      CX.fillStyle='#ff8800';CX.globalAlpha=.5+Math.sin(G.tick*.3)*.3;
      CX.fillRect(trap.x-8,trap.y-4,16,8);CX.globalAlpha=1;
    } else {
      CX.strokeStyle='#ff4400';CX.globalAlpha=.4+Math.sin(G.tick*.5)*.3;CX.lineWidth=1;
      CX.beginPath();CX.arc(trap.x,trap.y,trap.radius*.3,0,Math.PI*2);CX.stroke();
      CX.globalAlpha=1;
    }
  });
}

function drawEffects(){
  if(G.swingAnim){
    const sw=G.swingAnim;
    CX.save();CX.translate(sw.x,sw.y);
    const swCol=sw.col||'rgba(200,192,168,1)';
    // Parse colour for alpha
    CX.strokeStyle=swCol;CX.globalAlpha=sw.t/12;CX.lineWidth=3;
    CX.shadowColor=swCol;CX.shadowBlur=sw.col?8:0;
    const startA=sw.full?0:(sw.facing===1?-.3:Math.PI-.3);
    const endA=sw.full?Math.PI*2:(sw.facing===1?.3+Math.PI*.5:Math.PI+.3+Math.PI*.5);
    if(sw.full){for(let a=0;a<Math.PI*2;a+=.3){CX.beginPath();CX.moveTo(0,0);CX.lineTo(Math.cos(a)*sw.range,Math.sin(a)*sw.range);CX.stroke();}}
    else{CX.beginPath();CX.arc(0,0,sw.range,startA,endA);CX.stroke();}
    CX.shadowBlur=0;CX.globalAlpha=1;
    CX.restore();
  }
  // Smoke cloud
  if(G.smokeCloud){
    const sc=G.smokeCloud;
    const fade=Math.min(1,sc.timer/40)*Math.min(1,(sc.maxTimer-sc.timer)/20+.3);
    CX.save();
    CX.globalAlpha=fade*.35;
    CX.fillStyle='#888888';
    CX.beginPath();CX.arc(sc.x,sc.y,sc.radius,0,Math.PI*2);CX.fill();
    CX.globalAlpha=fade*.15;
    CX.fillStyle='#aaaaaa';
    CX.beginPath();CX.arc(sc.x,sc.y,sc.radius*.65,0,Math.PI*2);CX.fill();
    CX.globalAlpha=1;CX.restore();
  }
  // Dogmeat draw
  G.dogmeats.forEach(dm=>{
    CX.save();CX.translate(dm.x,dm.y);
    const leanAng=dm.biting?0:Math.atan2(dm.ty-dm.y,dm.tx-dm.x)*.3;
    CX.rotate(leanAng);
    // Dog body
    CX.fillStyle='#8b6030';CX.fillRect(-10,-8,20,12);
    CX.fillStyle='#7a5020';
    // Head
    CX.beginPath();CX.ellipse(10,-4,7,6,0,0,Math.PI*2);CX.fill();
    // Snout
    CX.fillStyle='#5a3010';CX.beginPath();CX.ellipse(16,-3,4,3,0,0,Math.PI*2);CX.fill();
    // Nose
    CX.fillStyle='#222';CX.beginPath();CX.arc(19,-3,1.5,0,Math.PI*2);CX.fill();
    // Eye
    CX.fillStyle='#1a0a00';CX.beginPath();CX.arc(9,-6,1.5,0,Math.PI*2);CX.fill();
    CX.fillStyle='#ff8800';CX.beginPath();CX.arc(9,-6,.8,0,Math.PI*2);CX.fill();
    // Ear
    CX.fillStyle='#5a3010';CX.beginPath();CX.moveTo(6,-8);CX.lineTo(2,-14);CX.lineTo(10,-10);CX.closePath();CX.fill();
    // Tail
    CX.strokeStyle='#8b6030';CX.lineWidth=3;
    CX.beginPath();CX.moveTo(-10,-2);CX.quadraticCurveTo(-16,-12,-12,-16);CX.stroke();
    // Legs (animated)
    const legAnim=dm.biting?0:Math.sin(dm.t*.4)*5;
    CX.fillStyle='#7a5020';
    CX.fillRect(-8,4,4,6+legAnim);CX.fillRect(-2,4,4,6-legAnim);
    CX.fillRect(4,4,4,6+legAnim);CX.fillRect(10,4,4,6-legAnim);
    // Bandana (red, Fallout style)
    CX.fillStyle='#cc2200';CX.beginPath();CX.moveTo(5,-9);CX.lineTo(14,-6);CX.lineTo(14,-4);CX.lineTo(5,-7);CX.closePath();CX.fill();
    if(dm.biting){CX.fillStyle='#ff4400';CX.globalAlpha=.5;CX.beginPath();CX.arc(16,-3,8,0,Math.PI*2);CX.fill();CX.globalAlpha=1;}
    CX.restore();
  });
  // Pip-Boy scan ring
  if(G.pipScan){
    CX.save();CX.globalAlpha=G.pipScan.t/40*.4;CX.strokeStyle='#00ffcc';CX.lineWidth=2;
    CX.beginPath();CX.arc(G.pipScan.x,G.pipScan.y,G.pipScan.r,0,Math.PI*2);CX.stroke();
    CX.globalAlpha=1;CX.restore();
  }
  // VATS overlay
  if(G.vatsSlow>0){
    CX.fillStyle=`rgba(0,255,200,${.03+Math.sin(G.tick*.1)*.01})`;CX.fillRect(0,0,W,H);
    CX.fillStyle='#00ffcc';CX.font="10px 'Courier New',monospace";CX.fillText('V.A.T.S: '+Math.ceil(G.vatsSlow/60)+'s',8,28);
  }
  // Slam ripple
  if(G.slamRipple){
    const sr=G.slamRipple;sr.t--;
    sr.r+=(sr.maxR-sr.r)*.25;
    CX.save();CX.globalAlpha=sr.t/(sr.t<10?sr.t:20)*.5;
    CX.strokeStyle=sr.col||'#8b5e3c';CX.lineWidth=3;
    CX.beginPath();CX.arc(sr.x,sr.y,sr.r,0,Math.PI*2);CX.stroke();
    CX.globalAlpha=1;CX.restore();
    if(sr.t<=0)G.slamRipple=null;
  }
  // Cracked ground slow zone
  if(G.crackedGround){
    const cg=G.crackedGround;cg.t--;
    CX.save();CX.globalAlpha=Math.min(cg.t/60,.4);
    CX.fillStyle='#5a3a1a';CX.fillRect(cg.x-cg.w/2,H-T-6,cg.w,6);
    CX.globalAlpha=1;CX.restore();
    if(cg.t<=0)G.crackedGround=null;
    // Slow enemies in cracked ground
    G.enemies.forEach(e=>{if(e.alive&&Math.abs(e.x+e.w/2-cg.x)<cg.w/2&&e.y+e.h>=H-T-8)e.vx*=0.5;});
  }
  // Holy aura pulse
  if(G.player&&G.player.holyAura){
    const ha=G.player.holyAura;ha.t--;ha.r=ha.maxR*(1-ha.t/30);
    CX.save();CX.globalAlpha=ha.t/30*.4;CX.strokeStyle='#f5c842';CX.lineWidth=3;
    CX.beginPath();CX.arc(ha.x,ha.y,ha.r,0,Math.PI*2);CX.stroke();
    CX.globalAlpha=1;CX.restore();
    if(ha.t<=0)G.player.holyAura=null;
  }
  // Smite bolt
  if(G.player&&G.player.smiteBolt){
    const sb=G.player.smiteBolt;sb.t--;
    CX.save();CX.globalAlpha=sb.t/20;CX.strokeStyle='#f5c842';CX.lineWidth=4;
    CX.beginPath();CX.moveTo(sb.x,0);CX.lineTo(sb.x,sb.y);CX.stroke();
    CX.strokeStyle='#fff';CX.lineWidth=1.5;CX.beginPath();CX.moveTo(sb.x,0);CX.lineTo(sb.x,sb.y);CX.stroke();
    CX.globalAlpha=1;CX.restore();
    if(sb.t<=0)G.player.smiteBolt=null;
  }
  // Shadow clones
  G.shadowClones.forEach(cl=>{
    CX.save();CX.globalAlpha=.55;
    CX.fillStyle='#444466';
    CX.fillRect(cl.x-8,cl.y-16,16,28);
    CX.fillStyle='#cc2222';CX.fillRect(cl.x-8,cl.y-6,16,3);
    CX.fillStyle='#ff4444';CX.beginPath();CX.arc(cl.x-3,cl.y-12,1.5,0,Math.PI*2);CX.fill();CX.beginPath();CX.arc(cl.x+3,cl.y-12,1.5,0,Math.PI*2);CX.fill();
    CX.globalAlpha=1;CX.restore();
  });
  if(G.lassoAnim){
    const la=G.lassoAnim;
    CX.strokeStyle=`rgba(212,134,10,${la.t/20})`;CX.lineWidth=2;CX.setLineDash([4,4]);
    CX.beginPath();CX.moveTo(la.x1,la.y1);CX.lineTo(la.x2,la.y2);CX.stroke();CX.setLineDash([]);
  }
}

function draw(){
  drawBg();
  if(!G.running&&!G.curClass)return;
  if(!G.running&&G.tick===0)return;
  drawProjs();drawTraps();drawEffects();
  G.enemies.forEach(e=>{ if(!e.alive)return; if(e.etype==="undead")drawUndead(e); else if(e.etype==="orc")drawOrc(e); else drawGoblin(e); });
  if(G.running||G.tick>0){CLASSES[G.curClass]?.drawPlayer(G.player,CX,G.tick);}
  G.parts.forEach(pt=>{CX.globalAlpha=pt.life;CX.fillStyle=pt.col;CX.fillRect(pt.x-pt.sz/2,pt.y-pt.sz/2,pt.sz,pt.sz);});CX.globalAlpha=1;
  G.floats.forEach(f=>{CX.globalAlpha=f.life;CX.font="bold 12px 'Courier New',monospace";CX.fillStyle=f.col;CX.textAlign='center';CX.fillText(f.txt,f.x,f.y);});CX.globalAlpha=1;CX.textAlign='left';
  if(G.stormTick>0){CX.fillStyle='#f5c842';CX.font="10px 'Courier New',monospace";CX.fillText('STORM: '+Math.ceil(G.stormTick/60)+'s',8,16);}
  if(G.spawnDelay>0){
    const secs=Math.ceil(G.spawnDelay/60);
    CX.textAlign='center';
    CX.fillStyle='rgba(0,0,0,.5)';CX.fillRect(W/2-80,H/2-55,160,48);
    CX.font="bold 16px 'Courier New',monospace";CX.fillStyle='#f5c842';
    CX.fillText('Goblins incoming in...',W/2,H/2-36);
    CX.font="bold 28px 'Courier New',monospace";CX.fillStyle='#e24b4a';
    CX.fillText(secs+'s',W/2,H/2-12);
    CX.textAlign='left';
  }
  const al=G.enemies.filter(e=>e.alive).length;
  CX.fillStyle='#4a6830';CX.font="10px 'Courier New',monospace";CX.fillText('goblins: '+al,W-90,16);
  if(!G.running&&G.tick>0){
    CX.fillStyle='rgba(0,0,0,.75)';CX.fillRect(0,0,W,H);CX.textAlign='center';
    const cls=CLASSES[G.curClass];
    CX.font="bold 24px Georgia,serif";CX.fillStyle=cls.col;CX.fillText(cls.name+' has fallen!',W/2,H/2-22);
    CX.font="13px 'Courier New',monospace";CX.fillStyle='#ccc';CX.fillText('Wave '+G.wave+' · Score '+G.score+' · Level '+G.level,W/2,H/2+10);
    CX.fillStyle='#555';CX.font="11px 'Courier New',monospace";CX.fillText('click [ Restart ] or choose a new class',W/2,H/2+40);CX.textAlign='left';
  }
}

// ── BOOT ──────────────────────────────────────────────────────
buildClassSelect();
updateHUD();draw();
requestAnimationFrame(function loop(){update();draw();requestAnimationFrame(loop);});
</script>
